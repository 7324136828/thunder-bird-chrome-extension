[package]
name = "mail-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP stdio server exposing mail operations through the local mail-backend's unlocked sessions"

[dependencies]
anyhow.workspace = true
base64.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rmcp = { version = "3.12.0", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
mail-proto = { workspace = true, features = ["testkit"] }
tempfile.workspace = true
