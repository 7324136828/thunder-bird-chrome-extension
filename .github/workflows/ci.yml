name: Build

# Builds, lints and tests the Rust backend (+ MCP server) and the Chrome/Edge
# extension, then publishes the build outputs as workflow artifacts.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Build (all targets, all features)
        run: cargo build --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Build release binaries
        run: cargo build --release --locked -p mail-backend -p mail-mcp

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ runner.os }}
          if-no-files-found: error
          path: |
            src/target/release/mail-backend
            src/target/release/mail-backend.exe
            src/target/release/mail-mcp
            src/target/release/mail-mcp.exe

  extension:
    name: Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck, bundle and package (dist/)
        run: npm run build:extension

      - name: Unit tests
        run: npm test

      - name: Zip the unpacked extension
        run: cd dist && zip -r ../webmail-extension.zip . -x '*.map'

      - name: Upload extension (unpacked)
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          if-no-files-found: error
          path: src/extension/dist

      - name: Upload extension (zip)
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          if-no-files-found: error
          path: src/extension/webmail-extension.zip

  e2e:
    name: E2E (headless Chrome)
    runs-on: ubuntu-latest
    needs: [extension]
    defaults:
      run:
        working-directory: src/extension
    env:
      # Warnings are only enforced in the backend job.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src
            src/extension/tools/fake-mail

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/extension/package-lock.json

      - run: npm ci

      - name: Build extension and debug backend
        run: |
          npm run build:extension
          cargo build --locked -p mail-backend --manifest-path ../Cargo.toml

      - name: Smoke test (mock backend)
        env:
          WEBMAIL_E2E_BROWSER: /usr/bin/google-chrome
        run: npm run test:e2e

      - name: Extension + real backend
        env:
          WEBMAIL_E2E_BROWSER: /usr/bin/google-chrome
        run: npm run test:e2e:real

  release:
    name: Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, extension, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          mkdir out
          cp artifacts/extension-zip/webmail-extension.zip out/
          for os in Linux Windows; do
            (cd "artifacts/backend-$os" && zip -r "../../out/backend-$os.zip" .)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
